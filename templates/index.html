<!DOCTYPE html>
<html>
<head>
    <title>AI CCTV Dashboard</title>
</head>
<body>
    <h1>AI CCTV Dashboard</h1>
    <p>รูปล่าสุดที่ตรวจพบจากกล้อง AI</p>

    <img id="latest" src="/static/uploads/latest.jpg" width="600">

    <script>
        setInterval(() => {
            document.getElementById("latest").src =
                "/static/uploads/latest.jpg?t=" + new Date().getTime();
        }, 3000);
    </script>
</body>
</html>
